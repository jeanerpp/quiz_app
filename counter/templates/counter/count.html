<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f4f6;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 24px 32px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            font-size: 18px;
            color: #374151;
        }

        .value {
            display: block;
            margin-top: 8px;
            font-size: 36px;
            font-weight: 700;
            color: #111827;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Visit Counter</h1>
        <p>This page has been accessed:
            <span class="value">{{ count }}</span>
        </p>
    </main>
</body>
</html>
