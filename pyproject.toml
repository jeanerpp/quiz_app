[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-demo"
version = "0.1.0"
description = "Django demo app with counter endpoint"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["aws_demo*", "counter*"]
exclude = ["venv*", "tests*"]
